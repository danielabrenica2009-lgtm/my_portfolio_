{% extends "base.html" %}
{% block title %}Area of Circle{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h1 style="margin: 0;">Area of Circle Calculator</h1>
    <a href="{{ url_for('works') }}" class="btn" style="padding: 0.5rem 1rem; font-size: 0.85rem; background: rgba(16, 185, 129, 0.2); color: var(--text-muted); border: 1px solid var(--border-glass);">
        &#8592; Back
    </a>
</div>

<form method="POST">
    <div class="form-group">
        <label for="radius">Radius:</label>
        <input type="number" step="any" id="radius" name="radius" placeholder="Enter radius value" required>
    </div>
    <button type="submit" class="btn">Calculate Area</button>
</form>

{% if result is not none %}
    <div class="output-box">
        <h3>Result:</h3>
        <p><strong>Radius:</strong> {{ radius }}</p>
        <p><strong>Calculated Area:</strong> {{ "%.2f"|format(result) }}</p>
    </div>
{% endif %}
{% endblock %}
