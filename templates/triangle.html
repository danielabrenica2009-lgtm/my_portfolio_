{% extends "base.html" %}
{% block title %}Area of Triangle{% endblock %}

{% block content %}
<h1>Area of Triangle Calculator</h1>
<form method="POST">
    <div class="form-group">
        <label for="base">Base:</label>
        <input type="number" step="any" id="base" name="base" placeholder="Enter base length" required>
    </div>
    <div class="form-group">
        <label for="height">Height:</label>
        <input type="number" step="any" id="height" name="height" placeholder="Enter height" required>
    </div>
    <button type="submit" class="btn">Calculate Area</button>
</form>

{% if result is not none %}
    <div class="output-box">
        <h3>Result:</h3>
        <p><strong>Base:</strong> {{ base }} | <strong>Height:</strong> {{ height }}</p>
        <p><strong>Calculated Area:</strong> {{ "%.2f"|format(result) }}</p>
    </div>
{% endif %}
{% endblock %}
