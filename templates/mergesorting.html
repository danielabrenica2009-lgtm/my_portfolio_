<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Sort - My Portfolio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .visualizer-card { background: rgba(2, 38, 30, 0.8); border: 1px solid var(--border-glass); border-radius: 16px; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-top: 1.5rem; }
        .bars-container { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 220px; margin: 1.5rem 0; padding: 10px; background: rgba(1, 22, 17, 0.6); border-radius: 12px; border: 1px solid var(--border-glass); }
        .sort-bar { flex: 1; background: #0ea5e9; border-radius: 6px 6px 0 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 5px; font-size: 0.75rem; font-weight: bold; color: #ffffff; transition: background 0.2s; }
        .sort-bar.comparing { background: #f59e0b !important; }
        .sort-bar.sorted { background: #10b981 !important; }
        .sort-bar.unsorted { background: #0ea5e9 !important; }
        
        .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
        .preset-btn { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--border-glass); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
        .preset-btn:hover { background: rgba(16, 185, 129, 0.4); }
        
        .custom-row { display: flex; gap: 10px; margin-bottom: 1.5rem; align-items: center; }
        .custom-input { flex: 1; background: rgba(1, 22, 17, 0.8); border: 1px solid var(--border-glass); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; }
        
        .controls-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; margin-top: 1.5rem; }
        .legend-row { display: flex; justify-content: center; gap: 20px; margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted); }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 12px; height: 12px; border-radius: 3px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">
            <img src="{{ url_for('static', filename='profile.jpg') }}" alt="Profile" class="nav-profile-img" onclick="openImageModal()">
            <a href="{{ url_for('index') }}" style="text-decoration: none;"><span class="logo">MyPortfolio</span></a>
        </div>
        <ul>
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('profile') }}">Profile</a></li>
            <li><a href="{{ url_for('works') }}" class="active">Works</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
    </nav>

    <div class="main-container" style="max-width: 900px;">
        <div class="calc-header-flex">
            <div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 0.75rem; color: var(--primary-green); font-weight: 700;">04 / DIVIDE & CONQUER</span>
                    <span style="background: rgba(16,185,129,0.15); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: var(--primary-green); font-weight: 600;">AVG O(n log n)</span>
                </div>
                <h1 style="margin: 2px 0; font-size: 1.6rem;">Merge Sort Visualization</h1>
            </div>
            <a href="{{ url_for('sorting_dashboard') }}" class="btn calc-back-btn">&#8592; Back to Sorting</a>
        </div>

        <div class="visualizer-card">
            <div class="preset-row">
                <button class="preset-btn" onclick="setPreset('random')">Random</button>
                <button class="preset-btn" onclick="setPreset('sorted')">Sorted</button>
                <button class="preset-btn" onclick="setPreset('nearly')">Nearly Sorted</button>
                <button class="preset-btn" onclick="setPreset('duplicates')">Many Duplicates</button>
            </div>

            <div class="custom-row">
                <input type="text" id="customInput" class="custom-input" placeholder="e.g. 8, 3, 5, 1, 9, 2">
                <button class="btn" onclick="applyCustomArray()" style="background: var(--primary-green); padding: 8px 16px;">Go</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">
                <span id="stepStatusText">Step 0 / 0</span>
                <span id="sortStatusMsg">Ready to sort</span>
            </div>

            <div class="bars-container" id="bars-container"></div>

            <div class="controls-row">
                <button class="btn" onclick="prevStep()" style="background: rgba(255,255,255,0.1); color: #fff;">◄ Previous</button>
                <button class="btn" onclick="togglePlay()" id="playBtn" style="background: var(--primary-green);">▶ Play</button>
                <button class="btn" onclick="nextStep()" style="background: rgba(255,255,255,0.1); color: #fff;">Next ►</button>
                <button class="btn" onclick="resetSorting()" style="background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4);">↺ Reset</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; flex-wrap: wrap; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Speed:</span>
                    <select id="speedSelect" onchange="changeSpeed(this.value)" style="background: rgba(2, 44, 34, 0.8); color: #fff; border: 1px solid var(--border-glass); padding: 6px 10px; border-radius: 6px; outline: none; cursor: pointer; font-size: 0.85rem;">
                        <option value="800">Slow</option>
                        <option value="400" selected>Moderate</option>
                        <option value="150">Fast</option>
                    </select>
                </div>

                <div class="legend-row" style="margin-top: 0;">
                    <div class="legend-item"><div class="legend-box" style="background: #f59e0b;"></div> Comparing</div>
                    <div class="legend-item"><div class="legend-box" style="background: #10b981;"></div> Sorted</div>
                    <div class="legend-item"><div class="legend-box" style="background: #0ea5e9;"></div> Unsorted</div>
                </div>
            </div>
        </div>
    </div>

    <div id="imageModal" class="image-modal" onclick="closeImageModal(event)"><div class="modal-content" onclick="event.stopPropagation()"><span class="modal-close" onclick="closeImageModalDirect()">&times;</span><img src="{{ url_for('static', filename='profile.jpg') }}" alt="Profile Photo"><h3 style="margin-top: 1rem; margin-bottom: 0.2rem; color: #ffffff;">Daniel Abrenica</h3><p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">Student / Aspiring Developer</p></div></div>
    <footer>&copy; 2026 Daniel Abrenica | My Personal Portfolio</footer>

    <script>
        let originalArray = [42, 18, 65, 27, 91, 34, 56, 12, 73, 48];
        let historySteps = [];
        let currentStepIndex = 0;
        let isPlaying = false;
        let playInterval = null;
        let animSpeed = 400;

        function changeSpeed(val) { animSpeed = parseInt(val); if(isPlaying) { stopPlay(); startPlay(); } }

        function initMergeSort(arr) {
            historySteps = [];
            let workingArr = [...arr];
            let sortedSet = new Set();

            historySteps.push({ arr: [...workingArr], comparing: [], sorted: [] });

            function mergeHelper(start, mid, end) {
                let left = workingArr.slice(start, mid + 1);
                let right = workingArr.slice(mid + 1, end + 1);
                let i = 0, j = 0, k = start;

                while (i < left.length && j < right.length) {
                    historySteps.push({ arr: [...workingArr], comparing: [start + i, mid + 1 + j], sorted: Array.from(sortedSet) });
                    if (left[i] <= right[j]) { workingArr[k] = left[i]; i++; } 
                    else { workingArr[k] = right[j]; j++; }
                    k++;
                    historySteps.push({ arr: [...workingArr], comparing: [k-1], sorted: Array.from(sortedSet) });
                }

                while (i < left.length) { workingArr[k] = left[i]; i++; k++; historySteps.push({ arr: [...workingArr], comparing: [k-1], sorted: Array.from(sortedSet) }); }
                while (j < right.length) { workingArr[k] = right[j]; j++; k++; historySteps.push({ arr: [...workingArr], comparing: [k-1], sorted: Array.from(sortedSet) }); }
            }

            function mergeSortRecursive(start, end) {
                if (start >= end) return;
                let mid = Math.floor((start + end) / 2);
                mergeSortRecursive(start, mid);
                mergeSortRecursive(mid + 1, end);
                mergeHelper(start, mid, end);
            }

            mergeSortRecursive(0, workingArr.length - 1);

            let n = workingArr.length;
            for(let i=0; i<n; i++) sortedSet.add(i);
            historySteps.push({ arr: [...workingArr], comparing: [], sorted: Array.from(sortedSet) });

            currentStepIndex = 0;
            renderStep();
        }

        function renderStep() {
            if(historySteps.length === 0) return;
            let state = historySteps[currentStepIndex];
            const container = document.getElementById('bars-container');
            container.innerHTML = '';

            state.arr.forEach((val, idx) => {
                const bar = document.createElement('div');
                bar.className = 'sort-bar unsorted';
                if(state.sorted.includes(idx)) bar.className = 'sort-bar sorted';
                if(state.comparing.includes(idx)) bar.className = 'sort-bar comparing';
                bar.style.height = `${val}%`;
                bar.textContent = val;
                container.appendChild(bar);
            });

            document.getElementById('stepStatusText').textContent = `Step ${currentStepIndex} / ${historySteps.length - 1}`;
            document.getElementById('sortStatusMsg').textContent = currentStepIndex === historySteps.length - 1 ? "Sorted!" : "Sorting in progress...";
        }

        function nextStep() { if(currentStepIndex < historySteps.length - 1) { currentStepIndex++; renderStep(); } else { stopPlay(); } }
        function prevStep() { if(currentStepIndex > 0) { currentStepIndex--; renderStep(); } }
        function togglePlay() { if(isPlaying) { stopPlay(); } else { startPlay(); } }

        function startPlay() {
            isPlaying = true;
            document.getElementById('playBtn').textContent = "❚❚ Pause";
            playInterval = setInterval(() => {
                if(currentStepIndex < historySteps.length - 1) { nextStep(); } else { stopPlay(); }
            }, animSpeed);
        }

        function stopPlay() { isPlaying = false; document.getElementById('playBtn').textContent = "▶ Play"; clearInterval(playInterval); }
        function resetSorting() { stopPlay(); currentStepIndex = 0; renderStep(); }

        function setPreset(type) {
            stopPlay();
            if(type === 'random') originalArray = [42, 18, 65, 27, 91, 34, 56, 12, 73, 48];
            if(type === 'sorted') originalArray = [12, 18, 27, 34, 42, 48, 56, 65, 73, 91];
            if(type === 'nearly') originalArray = [18, 12, 27, 34, 42, 48, 56, 65, 91, 73];
            if(type === 'duplicates') originalArray = [30, 10, 30, 20, 10, 40, 20, 50, 30, 10];
            initMergeSort(originalArray);
        }

        function applyCustomArray() {
            stopPlay();
            const inputVal = document.getElementById('customInput').value;
            if(!inputVal.trim()) return;
            let parsed = inputVal.split(',').map(item => parseInt(item.trim())).filter(num => !isNaN(num));
            if(parsed.length > 0) { originalArray = parsed; initMergeSort(originalArray); }
        }

        initMergeSort(originalArray);

        function openImageModal() { document.getElementById('imageModal').style.display = 'flex'; }
        function closeImageModalDirect() { document.getElementById('imageModal').style.display = 'none'; }
        function closeImageModal(event) { if (event.target.id === 'imageModal') document.getElementById('imageModal').style.display = 'none'; }
    </script>
</body>
</html>
