<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daniel.log(){% endblock %}</title>
    <!-- Professional Modern Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --primary-green: #10b981;
            --dark-green: #064e3b;
            --emerald-accent: #059669;
            --bg-dark: #022c22;
            --card-glass: rgba(6, 78, 59, 0.45);
            --border-glass: rgba(16, 185, 129, 0.25);
            --text-main: #ecfdf5;
            --text-muted: #a7f3d0;
        }

        /* REALISTIC DARK EMERALD GRADIENT WITH AMBIENT GLOW */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-main);
            background: radial-gradient(circle at 50% 0%, #065f46 0%, #022c22 75%);
            background-attachment: fixed;
        }

        /* GLASSMORPHISM NAVIGATION BAR */
        nav {
            background: rgba(2, 44, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 0.85rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .nav-brand:hover {
            transform: translateY(-1px);
        }

        /* PROFILE IMG STYLING WITH CURSOR POINTER */
        .nav-profile-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-green);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .nav-profile-img:hover {
            transform: scale(1.1);
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.8);
        }

        nav .logo {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 1rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background: rgba(16, 185, 129, 0.15);
            color: #ffffff;
        }

        /* REALISTIC FROSTED GLASS CARD CONTAINER */
        .main-container {
            flex: 1;
            max-width: 820px;
            width: 88%;
            margin: 2.5rem auto;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1, h2, h3 {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* MODERN BUTTONS */
        .btn {
            display: inline-block;
            background: var(--primary-green);
            color: #022c22;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            background: #34d399;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        /* IMAGE VIEWER MODAL STYLES */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 44, 34, 0.85);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal-content {
            position: relative;
            background: rgba(6, 78, 59, 0.6);
            border: 1px solid var(--border-glass);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 320px;
        }

        .modal-content img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-green);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #a7f3d0;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 1.2rem;
            background: rgba(2, 44, 34, 0.9);
            border-top: 1px solid var(--border-glass);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <!-- Used to 'onclick' event in opening the modal -->
            <img src="{{ url_for('static', filename='profile.jpg') }}" 
                 alt="Profile" 
                 class="nav-profile-img"
                 onclick="openImageModal()">
            <a href="{{ url_for('index') }}" style="text-decoration: none;">
                <span class="logo">MyPortfolio</span>
            </a>
        </div>

        <ul>
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('profile') }}">Profile</a></li>
            <li><a href="{{ url_for('works') }}">Works</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
    </nav>

    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- PROFILE IMAGE POPUP MODAL -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeImageModalDirect()">&times;</span>
            <img src="{{ url_for('static', filename='profile.jpg') }}" alt="Profile Photo">
            <h3 style="margin-top: 1rem; margin-bottom: 0.2rem; color: #ffffff;">Daniel Abrenica</h3>
            <p style="margin: 0; font-size: 0.85rem; color: #a7f3d0;">Student / Aspiring Developer</p>
        </div>
    </div>

    <footer>
        &copy; 2026 Daniel | Personal Portfolio & Lab Exercises.
    </footer>

    <!-- JAVASCRIPT FOR IMAGE MODAL -->
    <script>
        function openImageModal() {
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeImageModalDirect() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function closeImageModal(event) {
            if (event.target.id === 'imageModal') {
                document.getElementById('imageModal').style.display = 'none';
            }
        }
    </script>

</body>
</html>
